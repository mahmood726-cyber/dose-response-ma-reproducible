name: reproduce

# Every push runs the FULL validation (a few minutes per platform) natively on Linux, Windows and macOS
# and in the canonical Docker image, then checks that the runs are bit-identical. workflow_dispatch
# re-runs the same on demand: in a fork, Actions -> reproduce -> Run workflow.
# Each run writes its PASS/FAIL report to the job summary and as an artefact (reproduction-report-*);
# on this repository's main branch the latest report is also published to GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - run: Rscript bench/install_r_packages.R
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --quick
      - run: python reproduce.py
      - name: PASS/FAIL report to the job summary
        if: always()
        shell: bash
        run: |
          for m in full quick; do
            f="outputs/$m/reproduction_report.md"
            if [ -f "$f" ]; then { echo "## ${{ matrix.os }}: $m run"; tail -n +2 "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; else echo "## ${{ matrix.os }}: $m run produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-${{ matrix.os }}
          path: |
            outputs/full/reproduction_report.md
            outputs/full/stats.json
            outputs/quick/reproduction_report.md
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-${{ matrix.os }}
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t dose-response-ma-reproducible .
      - run: |
          mkdir -p outputs results
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" dose-response-ma-reproducible --quick
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" dose-response-ma-reproducible
      - name: PASS/FAIL report to the job summary
        if: always()
        run: |
          for m in full quick; do
            f="outputs/$m/reproduction_report.md"
            if [ -f "$f" ]; then { echo "## Docker (canonical): $m run"; tail -n +2 "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; else echo "## Docker: $m run produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-docker
          path: |
            outputs/full/reproduction_report.md
            outputs/full/stats.json
            outputs/quick/reproduction_report.md
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-docker
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  compare:
    if: always()
    needs: [native, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: runs
      - shell: bash
        run: |
          set -o pipefail
          { echo '## Cross-platform comparison'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python analysis/compare_runs.py runs/full-docker/results/full runs/full-ubuntu-latest/results/full runs/full-windows-latest/results/full --report-only runs/full-macos-latest/results/full | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Live results page: https://mahmood726-cyber.github.io/dose-response-ma-reproducible/
    # Only on this repository's main branch (forks and pull requests skip it).
    if: always() && github.repository_owner == 'mahmood726-cyber' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native, docker, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: runs
      - name: Update the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" pub
          else
            mkdir pub && git -C pub init --quiet -b gh-pages && git -C pub remote add origin "$url"
          fi
          python3 ci/build_site.py --runs runs --mode full --canonical full-docker \
            --platform "Docker (canonical)=full-docker" --platform "Linux=full-ubuntu-latest" \
            --platform "Windows=full-windows-latest" --platform "macOS=full-macos-latest" \
            --compare "${{ needs.compare.result }}" --site pub \
            --title "Dose-response meta-analysis app: validation against dosresmeta" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --mode-note "Full validation: every number in the paper." \
            --links "Paper archive (Zenodo)=https://doi.org/10.5281/zenodo.23135712" \
            --links "Live app=https://mahmood726-cyber.github.io/allmeta/dose-response-ma/"
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Results of run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})" && git push --quiet origin gh-pages
          echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
