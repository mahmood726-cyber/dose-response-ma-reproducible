name: reproduce

# Every push runs the FULL validation (about a minute of computation) natively on Linux,
# Windows and macOS and in the canonical Docker image, then checks that all four runs are
# bit-identical. workflow_dispatch re-runs the same on demand.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - run: Rscript bench/install_r_packages.R
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --quick
      - run: python reproduce.py
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-${{ matrix.os }}
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t dose-response-ma-reproducible .
      - run: |
          mkdir -p outputs results
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" dose-response-ma-reproducible --quick
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" dose-response-ma-reproducible
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-docker
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  compare:
    if: always()
    needs: [native, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: runs
      - run: python analysis/compare_runs.py runs/full-docker/results/full runs/full-ubuntu-latest/results/full runs/full-windows-latest/results/full runs/full-macos-latest/results/full
